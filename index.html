<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="안녕하세요. 김호재입니다.">
    <title>호재의 첫 웹사이트</title>

    <!-- 구글 폰튼-->
    <link rel="preconnect" href="https://fonts.goolgeapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- jua + Noto Sans Korean-->

    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <!-- font Awesome -->
    <script src="https://kit.fontawesome.com/9f383a228c.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <link rel="icon" href="images/absolute_radiance_favicon.png" type="image/png">
</head>

<body>
    <header class="header">

        <!-- font awesome_link: https://fontawesome.com/icons/brands/solid/superpowers -->
        <a href="#hero" class="logo"><i class="fa-brands fa-superpowers fa-spin fa-2xl"></i></a>
        
        <nav class="nav">
            <ul class="nav-list">
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        <button type="button" class="theme-toggle">다크 모드</button>
        <button type="button" class="hamburger">메뉴</button>
    </header>

    <main>
        <section id="hero">

            <h1 id="hero-title">안녕하세요 김호재입니다.</h1>
            <h3>기계와 컴퓨터에 관심이 많은 코디세이 올인원 2기입니다.</h3>
            <h3>원리에 대해 파악하는것을 좋아합니다.</h3>

            <a href="#projects" class="btn">프로젝트</a>
            <a href="#contact" class="btn">연락하기</a>

        </section>

        <section id="about"><h1>자기소개</h1>
            <div class="about-content">
                <img src="images/reg_made_in_abyss.webp" alt="만화 캐릭터" class="profile-img">
                <div class="about-text">
                    <p>안녕하세요</p>
                    <p>배우는걸 즐기는 김호재입니다.</p>
                    <p>남들과 함께 공부하며 익히는</p>
                    <p>코디세이 생활이 되었으면 합니다.</p>
                </div>
            </div>
        </section>

        <section id="skills">
            <h3>기술 스택</h3>
            <ul><li>파이썬</li></ul>
        </section>
        <section id="Learning">
            <h3>배우고 있는 기술</h3>
            <ul><li>JS(javascript)</li></ul>
        </section>
        <section id="projects">
            <h3>프로젝트</h3>
            <div class="status" id="projects-status"></div>
            <div class="project-filters" id="project-filters"></div>
            <div class="projects-grid" id="projects-grid"></div>
        </section>
        <section id="contact">
            <h3>연락하기 to ghwo6</h3>
            <form id="contact-form" novalidate>
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" placeholder="이름을 입력하세요">
                    <p class="error-msg" id="name-error"></p>
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" placeholder="your@email.com">
                    <p class="error-msg" id="email-error"></p>
                </div>

                <div class="form-group">
                    <label for="message">메시지</label>
                    <textarea id="message" rows="5" placeholder="문의 내용을 입력하세요"></textarea>
                    <p class="error-msg" id="message-error"></p>
                </div>
                <button type="submit">보내기</button>
                <p class="success-msg" id="success-msg"></p>
            </form>
        </section>
    </main>

    <footer>2026 · <a href='http://github.com/ghwo6' target="_blank">GitHub</a> <a href="https://app.notion.com/p/41c06c9569c2804b8740e06214f36919?source=copy_link" target="_blank">Notion</a></footer>
    <button type="button" class="scroll-top">↑</button>
</body>

</html>
